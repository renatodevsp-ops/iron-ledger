# Linter configuration.
#
# The enabled set is deliberately small: each linter here catches a class of bug
# this codebase has to avoid (money arithmetic, error handling, concurrency), and
# adding a stylistic linter mostly adds noise.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck      # an unchecked error is a silent failure
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint     # %w and errors.Is/As, so wrapped errors stay inspectable
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - copyloopvar

  exclusions:
    rules:
      # Table-driven tests legitimately repeat setup and often ignore an error
      # from a require helper that already failed the test.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # Generated and embedded migration files are not ours to lint.
      - path: migrations/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
