# Local development stack.
#
# Only the dependencies the service needs in order to run. The API itself is
# started with `make run`, not from here, so a change to the Go code does not
# require touching this file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ironledger
      POSTGRES_USER: ironledger
      POSTGRES_PASSWORD: ironledger
    ports:
      # Fixed on the host so the DSN in .env stays stable across restarts.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # A container that is merely running is not ready: the first connection
      # during init still fails, which produces a confusing start-up error.
      test: ["CMD-SHELL", "pg_isready -U ironledger -d ironledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      # LocalStack only. These credentials are meaningless outside this
      # container and must never be reused anywhere else.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8080", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      # The realm is served under http://localhost:8081, so the token issuer and
      # the JWKS URL agree whether the service dials it from the host or from a
      # container. A mismatch here is the most common cause of a 401 loop.
      - "8081:8080"

volumes:
  postgres-data:
